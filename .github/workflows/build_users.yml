name: Daily Top Users Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-updates
  cancel-in-progress: false

jobs:
  group-1:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '0 1 * * *' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Fetch Script (Group 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for country in LK US UK IN DE BR; do
            echo "=== Processing $country ==="
            node scripts/fetch_users.js "$country"
          done
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "update group 1 top followers data [skip ci]" || true
          fi
          git push

  group-2:
